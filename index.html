<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PFP Simulator & User Manager</title>

  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Three.js CDN untuk Background Animasi -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Tailwind Custom Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          },
          colors: {
            slate: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a'
            },
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    canvas#three-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 md:p-6 relative overflow-x-hidden">

  <!-- Canvas Three.js Background -->
  <canvas id="three-bg"></canvas>

  <!-- Container Utama -->
  <main class="w-full max-w-3xl bg-white/80 backdrop-blur-md rounded-2xl border border-slate-200/80 shadow-xl overflow-hidden flex flex-col md:flex-row transition-all duration-300 my-8">

    <!-- Sidebar Preview User -->
    <section class="bg-slate-100/70 p-6 md:p-8 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-slate-200 md:w-2/5">
      <div class="relative group">
        <div class="w-36 h-36 rounded-full overflow-hidden border-4 border-white shadow-lg bg-white mb-4 transition-transform duration-300 group-hover:scale-105">
          <img id="pfpImage" src="https://api.dicebear.com/7.x/bottts/svg?seed=asyifa" alt="Avatar" class="w-full h-full object-cover">
        </div>
        <span id="statusBadge" class="absolute bottom-4 right-2 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow border-2 border-white">
          Ready
        </span>
      </div>

      <h3 id="displayUsername" class="font-bold text-xl text-slate-800 text-center">User #1</h3>
      <p id="displayUserPfpStatus" class="text-xs text-slate-500 text-center mt-1 truncate max-w-[180px]">Default Avatar</p>
    </section>

    <!-- Content Panel -->
    <section class="p-6 md:p-8 flex-1 flex flex-col justify-between">
      <div>
        <!-- Setting Base API -->
        <div class="mb-6">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Base URL API Backend</label>
          <input type="text" id="apiUrl" value="http://localhost:3000" class="w-full h-10 px-3.5 rounded-lg border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all" placeholder="http://192.168.1.5:3000">
        </div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-200 mb-6 space-x-6">
          <button id="btnTabPfp" onclick="switchTab('pfp')" class="pb-3 text-sm font-bold border-b-2 border-brand-600 text-brand-600 transition-colors">
            Simulator PFP
          </button>
          <button id="btnTabAdd" onclick="switchTab('add')" class="pb-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-colors">
            Tambah User
          </button>
        </div>

        <!-- Tab 1: Simulator PFP -->
        <div id="tabPfp" class="block space-y-5">
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">ID User Database</label>
            <input type="number" id="userId" value="1" min="1" class="w-full h-10 px-3.5 rounded-lg border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
          </div>

          <div class="pt-2 border-t border-slate-100">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Aksi Perubahan Foto Profil</label>

            <!-- File Upload -->
            <div class="space-y-3">
              <div class="flex items-center gap-2">
                <input type="file" id="fileInput" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-50 file:text-brand-600 hover:file:bg-brand-100 cursor-pointer">
                <button onclick="startDirectUpload()" class="h-10 px-4 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs rounded-lg transition-colors shadow-sm shrink-0">
                  Upload File
                </button>
              </div>

              <!-- Action Buttons -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <button onclick="useRandomAvatar()" class="h-10 px-3 bg-white hover:bg-slate-50 text-slate-700 font-medium text-xs border border-slate-200 rounded-lg transition-colors shadow-sm">
                  Generate Avatar Acak
                </button>
                <button onclick="loadPfpFromDb()" class="h-10 px-3 bg-white hover:bg-slate-50 text-slate-700 font-medium text-xs border border-slate-200 rounded-lg transition-colors shadow-sm">
                  Load Profile by ID
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Tab 2: Tambah User -->
        <div id="tabAddUser" class="hidden space-y-5">
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Username Baru</label>
            <input type="text" id="newUsername" placeholder="Masukkan username" class="w-full h-10 px-3.5 rounded-lg border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
          </div>

          <button onclick="createNewUser()" class="w-full h-10 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs rounded-lg transition-colors shadow-sm">
            Simpan User Baru
          </button>

          <div id="createUserResult" class="hidden p-4 bg-slate-100 rounded-lg border border-slate-200 space-y-2">
            <p class="text-xs font-bold text-emerald-600">User Berhasil Ditambahkan</p>
            <div class="text-xs font-mono text-slate-600 space-y-1">
              <p>ID: <span id="resUserId" class="font-bold text-slate-900"></span></p>
              <p>Username: <span id="resUserName" class="font-bold text-slate-900"></span></p>
            </div>
            <button onclick="useNewUserId()" class="w-full mt-2 h-8 bg-white hover:bg-slate-50 text-slate-700 font-medium text-xs border border-slate-200 rounded-lg transition-colors">
              Gunakan ID Ini di Simulator
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Network Log Drawer -->
  <div class="fixed bottom-0 left-0 right-0 p-3 pointer-events-none z-50 flex justify-center">
    <div id="terminalContainer" class="w-full max-w-3xl bg-slate-900 border border-slate-800 rounded-xl shadow-2xl overflow-hidden pointer-events-auto transition-transform duration-300 transform translate-y-[calc(100%-2.5rem)]">
      <div class="bg-slate-950 px-4 py-2 border-b border-slate-800 flex justify-between items-center cursor-pointer" onclick="toggleTerminal()">
        <div class="flex space-x-1.5">
          <div class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-yellow-500"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
        </div>
        <span class="text-[11px] font-mono text-slate-400">Network Inspector</span>
        <svg id="terminalChevron" class="w-4 h-4 text-slate-400 transition-transform duration-300 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
        </svg>
      </div>
      <div id="logContent" class="p-4 h-44 overflow-y-auto font-mono text-xs text-emerald-400 whitespace-pre-wrap leading-relaxed">System ready. Waiting for requests...</div>
    </div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    // --- Three.js Background Animation Setup ---
    function initThreeJS() {
      const canvas = document.getElementById('three-bg');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Particles Geometry
      const count = 120;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);

      for (let i = 0; i < count * 3; i++) {
        positions[i] = (Math.random() - 0.5) * 15;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      // Particle Material
      const material = new THREE.PointsMaterial({
        size: 0.04,
        color: 0x3b82f6,
        transparent: true,
        opacity: 0.45
      });

      const particles = new THREE.Points(geometry, material);
      scene.add(particles);

      camera.position.z = 5;

      // Animation Loop
      function animate() {
        requestAnimationFrame(animate);
        particles.rotation.y += 0.0015;
        particles.rotation.x += 0.0008;
        renderer.render(scene, camera);
      }
      animate();

      // Window Resize Handler
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    window.addEventListener('DOMContentLoaded', initThreeJS);

    // --- UI Switcher & Log Helpers ---
    function switchTab(tab) {
      const tabPfp = document.getElementById('tabPfp');
      const tabAdd = document.getElementById('tabAddUser');
      const btnPfp = document.getElementById('btnTabPfp');
      const btnAdd = document.getElementById('btnTabAdd');

      if (tab === 'pfp') {
        tabPfp.classList.replace('hidden', 'block');
        tabAdd.classList.replace('block', 'hidden');
        btnPfp.className = "pb-3 text-sm font-bold border-b-2 border-brand-600 text-brand-600 transition-colors";
        btnAdd.className = "pb-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-colors";
      } else {
        tabAdd.classList.replace('hidden', 'block');
        tabPfp.classList.replace('block', 'hidden');
        btnAdd.className = "pb-3 text-sm font-bold border-b-2 border-brand-600 text-brand-600 transition-colors";
        btnPfp.className = "pb-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition-colors";
      }
    }

    function logMessage(msg, type = "info") {
      const logEl = document.getElementById('logContent');
      const time = new Date().toLocaleTimeString();
      let colorClass = "text-emerald-400";
      if (type === "error") colorClass = "text-rose-400";
      if (type === "warn") colorClass = "text-amber-300";

      logEl.innerHTML += `\n<span class="text-slate-500">[${time}]</span> <span class="${colorClass}">${msg}</span>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function toggleTerminal() {
      const terminal = document.getElementById('terminalContainer');
      const chevron = document.getElementById('terminalChevron');
      const isCollapsed = terminal.classList.contains('translate-y-[calc(100%-2.5rem)]');

      if (isCollapsed) {
        terminal.classList.remove('translate-y-[calc(100%-2.5rem)]');
        chevron.classList.remove('rotate-180');
      } else {
        terminal.classList.add('translate-y-[calc(100%-2.5rem)]');
        chevron.classList.add('rotate-180');
      }
    }

    function openTerminal() {
      const terminal = document.getElementById('terminalContainer');
      const chevron = document.getElementById('terminalChevron');
      terminal.classList.remove('translate-y-[calc(100%-2.5rem)]');
      chevron.classList.remove('rotate-180');
    }

    function getBaseApiUrl() {
      return document.getElementById('apiUrl').value.replace(/\/$/, "");
    }

    function getUserId() {
      return document.getElementById('userId').value;
    }

    function updateProfileUI(imageUrl, username = "User") {
      document.getElementById('pfpImage').src = imageUrl;
      document.getElementById('displayUsername').innerText = username;
      document.getElementById('displayUserPfpStatus').innerText = imageUrl;
      
      const badge = document.getElementById('statusBadge');
      badge.innerText = "Updated";
      badge.className = "absolute bottom-4 right-2 bg-brand-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow border-2 border-white";
      
      setTimeout(() => {
        badge.innerText = "Ready";
        badge.className = "absolute bottom-4 right-2 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow border-2 border-white";
      }, 2000);
    }

    // --- Core API Actions ---
    async function updateDatabase(finalUrl, publicId = null) {
      const apiUrl = getBaseApiUrl();
      const userId = getUserId();

      logMessage(`\n[API REQUEST] PATCH ${apiUrl}/api/users/${userId}/pfp`, "warn");

      const payload = { imageUrl: finalUrl };
      if (publicId) payload.publicId = publicId;

      try {
        const response = await fetch(`${apiUrl}/api/users/${userId}/pfp`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Gagal memperbarui database');

        logMessage(`[API RESPONSE] 200 OK - Database Updated!`);
        logMessage(`[DB RECORD] ${JSON.stringify(result.data)}`);

        updateProfileUI(result.data.pfp_url, result.data.username);
      } catch (err) {
        logMessage(`[DB ERROR] ${err.message}`, "error");
        alert(`Error Backend: ${err.message}`);
      }
    }

    async function loadPfpFromDb() {
      const apiUrl = getBaseApiUrl();
      const userId = getUserId();

      if (!apiUrl || !userId) return alert("Isi URL API dan User ID terlebih dahulu");

      openTerminal();
      logMessage(`\n=== MEMUAT DATA USER ===`);
      logMessage(`[API REQUEST] GET ${apiUrl}/api/users/${userId}/pfp`, "warn");

      try {
        const response = await fetch(`${apiUrl}/api/users/${userId}/pfp`);
        const result = await response.json();

        if (!response.ok) throw new Error(result.message || 'User tidak ditemukan');

        logMessage(`[API RESPONSE] 200 OK - Data Ditemukan`);
        logMessage(`[DB RECORD] ${JSON.stringify(result.data)}`);

        const pfpUrl = result.data.pfp_url || "https://api.dicebear.com/7.x/bottts/svg?seed=default";
        updateProfileUI(pfpUrl, result.data.username || "User");
      } catch (err) {
        logMessage(`[ERROR] ${err.message}`, "error");
        alert(err.message);
      }
    }

    async function useRandomAvatar() {
      if (!getBaseApiUrl() || !getUserId()) return alert("Isi URL API dan User ID terlebih dahulu");

      openTerminal();
      const seed = Math.random().toString(36).substring(7);
      const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${seed}`;

      logMessage(`\n=== GENERATE AVATAR ACAK ===`);
      logMessage(`URL Avatar: ${avatarUrl}`);

      await updateDatabase(avatarUrl);
    }

    async function startDirectUpload() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      const apiUrl = getBaseApiUrl();
      const userId = getUserId();

      if (!file) return alert("Pilih file gambar terlebih dahulu");
      if (!apiUrl || !userId) return alert("Isi URL API dan User ID terlebih dahulu");

      openTerminal();
      logMessage(`\n=== UPLOAD KE CLOUDINARY ===`);
      logMessage(`[API REQUEST] Signature: GET ${apiUrl}/api/users/${userId}/pfp-signature`, "warn");

      let signatureData;
      try {
        const res = await fetch(`${apiUrl}/api/users/${userId}/pfp-signature`);
        if (!res.ok) throw new Error("Gagal mendapatkan signature dari backend");
        signatureData = await res.json();
        logMessage(`[API RESPONSE] 200 OK - Signature Diterima`);
      } catch (err) {
        return logMessage(`[ERROR] ${err.message}`, "error");
      }

      logMessage(`[CLOUDINARY REQUEST] POST Direct Upload (File: ${file.name})`, "warn");

      const formData = new FormData();
      formData.append('file', file);
      formData.append('api_key', signatureData.apiKey);
      formData.append('timestamp', signatureData.timestamp);
      formData.append('signature', signatureData.signature);
      formData.append('folder', signatureData.folder);

      try {
        const cloudinaryRes = await fetch(`https://api.cloudinary.com/v1_1/${signatureData.cloudName}/image/upload`, {
          method: 'POST',
          body: formData
        });

        const cloudinaryResult = await cloudinaryRes.json();
        if (!cloudinaryRes.ok) throw new Error(cloudinaryResult.error.message);

        logMessage(`[CLOUDINARY RESPONSE] 200 OK - Direct Upload Berhasil`);
        logMessage(`Public ID: ${cloudinaryResult.public_id}`);

        await updateDatabase(cloudinaryResult.secure_url, cloudinaryResult.public_id);
      } catch (err) {
        logMessage(`[CLOUDINARY ERROR] ${err.message}`, "error");
      }
    }

    async function createNewUser() {
      const apiUrl = getBaseApiUrl();
      const username = document.getElementById('newUsername').value.trim();

      if (!apiUrl) return alert("Isi Base URL API terlebih dahulu");
      if (!username) return alert("Isi username terlebih dahulu");

      openTerminal();
      logMessage(`\n=== MEMBUAT USER BARU ===`);
      logMessage(`[API REQUEST] POST ${apiUrl}/api/users`, "warn");

      try {
        const response = await fetch(`${apiUrl}/api/users`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Gagal membuat user');

        logMessage(`[API RESPONSE] 201 Created`);
        logMessage(`[DB RECORD] ${JSON.stringify(result.data)}`);

        const newId = result.data.id;
        const newName = result.data.username;

        document.getElementById('resUserId').innerText = newId;
        document.getElementById('resUserName').innerText = newName;
        
        const resBox = document.getElementById('createUserResult');
        resBox.classList.remove('hidden');
        resBox.dataset.newId = newId;
      } catch (err) {
        logMessage(`[ERROR] ${err.message}`, "error");
        alert(err.message);
      }
    }

    function useNewUserId() {
      const newId = document.getElementById('createUserResult').dataset.newId;
      if (newId) {
        document.getElementById('userId').value = newId;
        switchTab('pfp');
        document.getElementById('createUserResult').classList.add('hidden');
        document.getElementById('newUsername').value = "";
      }
    }
  </script>
</body>
</html>
